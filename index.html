<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action ou Vérité</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #f39c12;
            --accent-hover: #e67e22;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: var(--accent-color);
        }

        #zone-question {
            margin: 30px 0;
            font-size: 1.2rem;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            line-height: 1.4;
        }

        .btn-groupe {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .selecteur-theme {
            margin-bottom: 20px;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            background-color: #2c2c2c;
            color: white;
            border: 1px solid #444;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Action ou Vérité 🔥</h1>
        
        <div class="selecteur-theme">
            <label for="choix-theme">Thème : </label>
            <select id="choix-theme">
                <option value="classic">Classique</option>
                <option value="hot" selected>Hot (Coquin)</option>
            </select>
        </div>

        <div id="zone-question">
            Clique sur un bouton pour commencer !
        </div>

        <div class="btn-groupe">
            <button id="btn-action">Action</button>
            <button id="btn-verite">Vérité</button>
        </div>
    </div>

    <script>
        // 1. Définition des bases de données de questions
        const questionsHot = {
            action: [
                "Fais un bisou dans le cou de la personne à ta gauche.",
                "Imite ta position ou ta tête préférée pendant un moment intime.",
                "Envoie un message vocal langoureux au dernier contact de ton répertoire (hors famille).",
                "Laisse quelqu'un te bander les yeux et deviner un objet ou une partie du corps.",
                "Prends une pose ultra suggestive pendant 10 secondes face caméra."
            ],
            verite: [
                "Quel est ton plus grand fantasme secret que tu n'as jamais osé avouer ?",
                "Quelle a été ta pire ou ta plus drôle expérience lors d'un plan cul ?",
                "Si tu devais passer une nuit torride avec une célébrité, ce serait qui ?",
                "Quelle est la chose la plus folle ou insolite que tu aies faite par désir ?",
                "Quel est ton 'guilty pleasure' le plus intense en matière de séduction ?",
                "Quelle est la position ou le truc le plus osé que tu aimerais essayer ?",
                "Quel est l'endroit le plus insolite où tu as eu des envies ou des actes coquins ?"
            ]
        };

        const questionsClassic = {
            action: [
                "Fais 10 pompes tout de suite.",
                "Envoie le dernier emoji de ton historique à ton dernier SMS.",
                "Parle avec un accent étranger pendant les 3 prochains tours."
            ],
            verite: [
                "Quel est ton pire secret avouable ?",
                "Quelle est la chose la plus embarrassante que tu aies faite en public ?",
                "Quel est ton plus grand regret jusqu'à présent ?"
            ]
        };

        // 2. Pools de travail (copies pour gérer l'anti-répétition sans vider les listes d'origine)
        let poolActuel = {
            hot: {
                action: [...questionsHot.action],
                verite: [...questionsHot.verite]
            },
            classic: {
                action: [...questionsClassic.action],
                verite: [...questionsClassic.verite]
            }
        };

        // 3. Fonction de tirage unique sans doublon
        function tirerQuestion(type) {
            const themeSelect = document.getElementById('choix-theme').value;
            let poolType = poolActuel[themeSelect][type];

            // Si toutes les questions du pool ont été épuisées, on recharge le pool complet
            if (poolType.length === 0) {
                if (themeSelect === 'hot') {
                    poolActuel.hot.action = [...questionsHot.action];
                    poolActuel.hot.verite = [...questionsHot.verite];
                } else {
                    poolActuel.classic.action = [...questionsClassic.action];
                    poolActuel.classic.verite = [...questionsClassic.verite];
                }
                poolType = poolActuel[themeSelect][type];
            }

            // Sélection aléatoire et suppression de la liste pour ne pas la revoir tout de suite
            const indexAleatoire = Math.floor(Math.random() * poolType.length);
            const questionTiree = poolType.splice(indexAleatoire, 1)[0];

            // Affichage dans l'interface
            document.getElementById('zone-question').innerText = questionTiree;
        }

        // 4. Écouteurs d'événements sur les boutons
        document.getElementById('btn-action').addEventListener('click', () => {
            tirerQuestion('action');
        });

        document.getElementById('btn-verite').addEventListener('click', () => {
            tirerQuestion('verite');
        });
    </script>
</body>
</html>
